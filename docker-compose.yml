services:
  postgres:
    image: postgres:17-alpine
    container_name: dbfork-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp_development
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
